<title>The American Century</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@300..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Public+Sans:ital,wght@0,300..800;1,300..800&display=swap">
<style>
/* Layout: one living 3D timeline (canvas) that a camera flies along; each slide is a 1920x1080 overlay that arrives and leaves with the camera. */
:root {
  color-scheme: dark;
  --ink: #0D0F12; --ink2: #161A20; --ink3: #262B33; --bone: #F3EDE1; --smoke: #A9A397; --paper: #EFE8DA; --paper2: #E2D8C4; --char: #1C1A17; --umber: #5A5145;
  --brass: #D9A84E; --red: #C8372D; --redd: #A1281F; --blood: #8F2119; --redl: #E6685C; --cream: #F3D9A0; --blue: #7FB0E6; --amber: #E89A45; --bluef: #2F5F96; --amberf: #A3621F;
  --display: 'Playfair Display', Georgia, serif;
  --cond: 'Oswald', 'Arial Narrow', sans-serif;
  --text: 'Public Sans', Arial, sans-serif;
}
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--bone); font-family: var(--text); overflow: hidden; cursor: default; overscroll-behavior: none; }
body.idle { cursor: none; }
#world { position: fixed; inset: 0; display: block; }
#veil { position: fixed; inset: 0; background: linear-gradient(100deg, rgba(6,8,11,.86) 0%, rgba(6,8,11,.68) 48%, rgba(6,8,11,.36) 100%); opacity: 0; transition: opacity 1.2s ease; pointer-events: none; }
#tint { position: fixed; inset: 0; background: #040507; opacity: 0; transition: opacity 1.4s ease, background-color 1.4s ease; pointer-events: none; }
#stage { position: fixed; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 50% 50%; transform: translate(-50%, -50%); pointer-events: none; }

/* engine letterbox (act openers built for the timeline) */
.elb { position: absolute; left: -2000px; width: 5920px; height: 56px; background: #000; z-index: 5; transition: transform 1.4s cubic-bezier(.7,0,.2,1); }
#lbT { top: 0; transform: translateY(-100%); }
#lbB { bottom: 0; transform: translateY(100%); }
#stage.lbon #lbT, #stage.lbon #lbB { transform: none; }

/* every slide */
.scene { position: absolute; inset: 0; }
.scene:not(.live) { display: none !important; }

/* slides built for the timeline: each part arrives on its own */
.proto { box-sizing: border-box; padding: 128px 128px 168px; display: flex; flex-direction: column; }
.proto .a { opacity: 0; transform: translate3d(calc(var(--dir, 1) * 56px), 0, 0); filter: blur(10px);
  transition: opacity .9s cubic-bezier(.2,.7,.2,1), transform 1.2s cubic-bezier(.16,.84,.24,1), filter 1s ease; transition-delay: calc(var(--i, 0) * 110ms); }
.proto.on .a { opacity: 1; transform: none; filter: none; }
.proto.leaving .a { opacity: 0; transform: translate3d(calc(var(--dir, 1) * -72px), 0, 0); filter: blur(8px); transition-duration: .5s, .6s, .5s; transition-delay: calc(var(--i, 0) * 22ms); }
.proto .b { opacity: 0; transform: translateY(22px); transition: opacity .7s ease, transform .9s cubic-bezier(.16,.84,.24,1), background-color .8s ease, border-color .8s ease; }
.proto.on .b.shown { opacity: 1; transform: none; }
.proto.still .a, .proto.still .b { transition: none !important; }

/* slides carried over from the deck: the whole slide glides in, then its own animations play */
.port > .content { position: absolute; inset: 0; box-sizing: border-box; padding: 128px 128px 160px; display: flex; flex-direction: column; color: var(--bone); }
.port.on > .content { animation: portIn 1.15s cubic-bezier(.16,.84,.24,1) both; }
.port.leaving > .content { opacity: 0; transform: translate3d(calc(var(--dir, 1) * -80px), 0, 0); filter: blur(8px); transition: opacity .5s ease, transform .6s ease, filter .5s ease; }
@keyframes portIn { from { opacity: 0; transform: translate3d(calc(var(--dir, 1) * 64px), 0, 0); filter: blur(10px); } }
:where(.port .content div) { position: relative; }
.port.map-in .mapimg { animation: mapIn 1.5s cubic-bezier(.16,.84,.24,1) both; transform-origin: 30% 100%; }
@keyframes mapIn { from { opacity: 0; transform: perspective(1400px) rotateX(24deg) translateY(60px) scale(.94); } }

/* ===== deck styles (scoped to carried-over slides) ===== */
/*@DECKCSS@*/
.port .card { background: rgba(22,26,32,.78); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.port .fragment { opacity: 0; transform: translateY(18px); transition: opacity .6s ease, transform .6s ease; }
.port .fragment.shown { opacity: 1; transform: none; }

/* ===== timeline-built slides ===== */
.proto .scrim-l { position: absolute; left: 0; top: 0; width: 1300px; height: 1080px; background: linear-gradient(90deg, rgba(7,9,12,.86) 0%, rgba(7,9,12,.6) 55%, rgba(7,9,12,0) 100%); }
.proto .scrim-b { position: absolute; left: 0; bottom: 0; width: 1920px; height: 620px; background: linear-gradient(0deg, rgba(7,9,12,.9) 0%, rgba(7,9,12,.55) 60%, rgba(7,9,12,0) 100%); }
.proto .scrim-t { position: absolute; left: 0; top: 0; width: 1920px; height: 460px; background: linear-gradient(180deg, rgba(7,9,12,.8) 0%, rgba(7,9,12,0) 100%); }
.proto > *:not([class*="scrim"]) { position: relative; }
.proto .eyebrow { margin: 0 0 20px; font: 700 24px/1.2 var(--text); letter-spacing: 4px; text-transform: uppercase; color: var(--brass); }
.proto .title { margin: 0; font: 600 72px/1.06 var(--display); letter-spacing: -1px; color: var(--bone); text-wrap: balance; }
.proto .acttitle { margin: 0; font: 600 160px/1 var(--display); letter-spacing: -3px; color: var(--bone); }
.proto .actsub { margin: 22px 0 0; font: 400 36px/1.2 var(--cond); letter-spacing: 6px; text-transform: uppercase; color: var(--brass); }
.proto .lede { margin: 24px 0 0; max-width: 1080px; font: 400 30px/1.42 var(--text); color: #C9C2B4; }
.proto .body { margin: 0; font: 400 24px/1.45 var(--text); color: #BDB6A8; }
.proto .k { margin: 0; font: 500 28px/1.1 var(--cond); letter-spacing: 2px; color: var(--brass); }
.proto .h3 { margin: 0; font: 500 38px/1.1 var(--cond); letter-spacing: 1px; text-transform: uppercase; color: var(--bone); }
.proto .quote { margin: 0; font: italic 400 40px/1.3 var(--display); color: var(--bone); }
.proto .cite { margin: 16px 0 0; font: 600 24px/1.3 var(--text); letter-spacing: 3px; text-transform: uppercase; color: var(--smoke); }
.proto .hook { margin: 0; font: italic 400 34px/1.3 var(--display); color: var(--cream); }
.proto .hint { margin: 0; font: 600 22px/1.3 var(--text); letter-spacing: 3px; text-transform: uppercase; color: var(--smoke); }
.proto .hint b { color: var(--bone); }
.proto .vrule { border-left: 4px solid var(--brass); padding-left: 32px; }
.proto .row { display: flex; gap: 22px; }
.proto .glass { flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 30px 32px; background: rgba(14,17,22,.64); border-top: 3px solid var(--brass); backdrop-filter: blur(10px) saturate(115%); -webkit-backdrop-filter: blur(10px) saturate(115%); }
.proto .paperc { flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 30px 32px; background: rgba(239,232,218,.94); border-top: 4px solid #A1281F; color: var(--char); }
.proto .paperc .big { margin: 0; font: 500 120px/.9 var(--cond); color: #A1281F; }
.proto .paperc .h3 { color: var(--char); }
.proto .paperc .body { color: var(--umber); }
#sc-cover { justify-content: center; }
.proto .brackets { position: absolute; inset: 64px; }
.proto .brackets::before, .proto .brackets::after { content: ""; position: absolute; width: 70px; height: 70px; border: 2px solid rgba(243,237,225,.32); }
.proto .brackets::before { left: 0; top: 0; border-right: 0; border-bottom: 0; }
.proto .brackets::after { right: 0; bottom: 0; border-left: 0; border-top: 0; }
.proto .rule { width: 220px; height: 4px; margin: 44px 0 0; background: var(--red); }
.proto .lamps { display: flex; justify-content: space-between; width: 1100px; margin: 56px 0 0; }
.proto .lamp { width: 24px; height: 24px; border-radius: 50%; background: #2B2E33; }
.proto.on .lamp { animation: dim 1.5s ease both; animation-delay: calc(var(--n) * 360ms + 1800ms); }
.proto .fusebox { position: relative; height: 6px; margin: 48px 0 16px; background: rgba(243,237,225,.12); }
.proto .fuse { position: absolute; left: 0; top: 0; height: 6px; width: 0; background: linear-gradient(90deg, #8F2119, var(--red)); transition: width 1.1s cubic-bezier(.3,.6,.2,1); }
.proto .fuse::after { content: ""; position: absolute; right: -10px; top: -7px; width: 20px; height: 20px; border-radius: 50%; background: #FFE3A3; box-shadow: 0 0 22px 10px rgba(255,170,90,.6); }
.proto .link { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 24px 22px; background: rgba(22,26,32,.8); border-top: 4px solid #3A3F48; }
.proto .link.shown { background: rgba(58,21,18,.86); border-top-color: var(--red); }
.proto .link .h3 { font-size: 32px; }

/* HUD */
#hud { position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s ease; }
#hud.show { opacity: 1; }
#hudlow { position: absolute; inset: 0; transition: opacity .6s ease; }
#hudlow.off { opacity: 0; }
#ystamp { position: absolute; right: 128px; top: 52px; margin: 0; font: 700 40px/1 var(--cond); letter-spacing: 2px; color: #8A7345; transition: opacity .6s ease; }
#foot { position: absolute; left: 128px; bottom: 62px; margin: 0; font: 700 24px/1 var(--text); letter-spacing: 3px; text-transform: uppercase; color: var(--smoke); white-space: nowrap; transition: opacity .6s ease; }
#rail { position: absolute; left: 720px; bottom: 74px; width: 900px; height: 2px; background: rgba(243,237,225,.18); }
#rfill { position: absolute; left: 0; top: 0; height: 2px; width: 0; background: linear-gradient(90deg, rgba(217,168,78,0), var(--brass)); }
#rdot { position: absolute; left: 713px; bottom: 68px; width: 14px; height: 14px; border-radius: 50%; background: var(--brass); box-shadow: 0 0 0 6px rgba(217,168,78,.22), 0 0 18px 4px rgba(217,168,78,.35); }
#ryear { position: absolute; left: 670px; bottom: 90px; width: 100px; margin: 0; text-align: center; font: 500 24px/1 var(--cond); letter-spacing: 2px; color: var(--brass); font-variant-numeric: tabular-nums; }
#pg { position: absolute; right: 128px; bottom: 62px; margin: 0; font: 400 24px/1 var(--cond); letter-spacing: 2px; color: var(--smoke); font-variant-numeric: tabular-nums; }

/* presenter chrome */
#controls { position: fixed; right: max(20px, env(safe-area-inset-right, 0px)); bottom: max(20px, env(safe-area-inset-bottom, 0px)); display: flex; gap: 6px; padding: 6px; border-radius: 12px; background: rgba(13,15,18,.72); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); opacity: 0; transition: opacity .4s ease; z-index: 20; }
body:not(.idle) #controls { opacity: 1; }
#controls button { display: grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 8px; background: transparent; color: var(--bone); cursor: pointer; }
#controls button:hover { background: rgba(243,237,225,.1); }
#controls button:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }
#controls svg { width: 22px; height: 22px; }
#notes { position: fixed; left: 50%; bottom: max(84px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(1100px, calc(100% - 40px)); max-height: 38vh; overflow: auto; box-sizing: border-box; padding: 22px 26px; border-radius: 14px; background: rgba(10,12,15,.94); border: 1px solid rgba(243,237,225,.12); font: 400 19px/1.55 var(--text); color: #E4DED2; z-index: 20; }
#notes .meta { margin: 0 0 8px; font: 600 13px/1 var(--text); letter-spacing: 2px; text-transform: uppercase; color: var(--brass); }
#notes p { margin: 0; }
#help { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); display: grid; grid-template-columns: auto auto; gap: 12px 28px; padding: 28px 34px; border-radius: 14px; background: rgba(10,12,15,.95); border: 1px solid rgba(243,237,225,.12); font: 400 18px/1.3 var(--text); z-index: 21; }
#help b { font-weight: 700; color: var(--brass); }
#toast { position: fixed; left: 50%; top: max(24px, env(safe-area-inset-top, 0px)); transform: translateX(-50%); padding: 10px 18px; border-radius: 999px; background: rgba(10,12,15,.9); font: 600 15px/1 var(--text); letter-spacing: 1px; opacity: 0; transition: opacity .3s ease; z-index: 22; pointer-events: none; }
#toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) {
  .proto .a, .proto .b { transform: none !important; filter: none !important; transition-property: opacity !important; }
  .port.on > .content, .port.map-in .mapimg { animation-name: fadeOnly !important; }
  @keyframes fadeOnly { from { opacity: 0; } }
}
</style>

<canvas id="world" aria-hidden="true"></canvas>
<div id="veil"></div>
<div id="tint"></div>

<div id="stage" aria-live="polite">
  <div id="lbT" class="elb"></div><div id="lbB" class="elb"></div>
<!--@SCENES@-->
  <div id="hud">
    <p id="ystamp"></p>
    <div id="hudlow">
      <p id="foot"></p>
      <div id="rail"><div id="rfill"></div></div>

      <p id="ryear">1898</p>

  <button id="bPrev" type="button" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  <button id="bNext" type="button" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
  <button id="bNotes" type="button" aria-label="Speaker notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 10h16M4 15h10M4 20h7"/></svg></button>
  <button id="bFull" type="button" aria-label="Full screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>

  <b>Next</b><span>→, space, scroll down, or click the right side</span>

<script>
/*@CONFIG@*/
(() => {
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv = document.getElementById('world'), ctx = cv.getContext('2d');
  const stage = document.getElementById('stage');
  const $ = id => document.getElementById(id);
  const SC = window.SCENES;

  /* ---------- the world: x is time, y is up, z points at the viewer ---------- */
  const YX = y => (y - 1898) * 140;
  const ACTS = [
    { roman: '', name: 'Prologue', dates: '1898–1914', y0: 1898, y1: 1914, c: [96, 104, 120] },
    { roman: 'I', name: 'The Great War', dates: '1914–1918', y0: 1914, y1: 1918.9, c: [200, 55, 45] },
    { roman: 'II', name: 'Between the Wars', dates: '1919–1939', y0: 1918.9, y1: 1939.7, c: [160, 126, 62] },
    { roman: 'III', name: 'World War II', dates: '1939–1945', y0: 1939.7, y1: 1945.7, c: [200, 55, 45] },
    { roman: 'IV', name: 'The Cold War', dates: '1945–1969', y0: 1945.7, y1: 1969.6, c: [62, 116, 181] }
  ];
  const PILLARS = [[1898, 'The Maine'], [1914, 'The guns of August'], [1917, 'America enters'], [1918, 'Armistice'], [1929, 'The Crash'], [1939, 'War in Europe'], [1941, 'Pearl Harbor'], [1944, 'D-Day'], [1945, 'Victory'], [1950, 'Korea'], [1957, 'Sputnik'], [1962, 'Thirteen days'], [1969, 'The Moon']];
  const PH = 520;
  const MOON = [YX(1969) + 1600, 1300, -3500];

  /* ---------- camera shots ---------- */
  function shotFor(sc) {
    if (sc.cam) return { cam: sc.cam, tgt: sc.tgt };
    const X = YX(sc.year) + (sc.jit || 0);
    switch (sc.shot) {
      case 'map': return { cam: [X + 520, 1250, 2300], tgt: [X + 380, 60, -400] };
      case 'black': return { cam: [X - 160, 140, 760], tgt: [X - 520, 150, 0] };
      case 'act': return { cam: [X - 280, 150, 1380], tgt: [X - 450, 330, -300] };
      case 'closing': return { cam: [8600, 520, 2300], tgt: [8880, 600, -1700] };
      default: {
        const v = [
          { cam: [X - 60, 330, 1250], tgt: [X - 480, 20, 0] },
          { cam: [X + 720, 620, 1580], tgt: [X - 360, 160, 0] },
          { cam: [X - 520, 430, 940], tgt: [X, 40, -260] },
          { cam: [X + 260, 980, 1900], tgt: [X - 260, 0, -240] }
        ];
        return v[(sc.v || 0) % 4];
      }
    }
  }
  SC.forEach(sc => {
    const s = shotFor(sc); sc.c = s.cam; sc.t = s.tgt;
    let best = null; PILLARS.forEach(p => { if (Math.abs(p[0] - sc.year) <= .6 && (best == null || Math.abs(p[0] - sc.year) < Math.abs(best - sc.year))) best = p[0]; });
    if (sc.focus == null) sc.focus = best;
  });

  /* ---------- vector helpers ---------- */
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const len = a => Math.hypot(a[0], a[1], a[2]);
  const norm = a => { const l = len(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const lerp = (a, b, t) => a + (b - a) * t;
  const lerp3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

  /* ---------- projection ---------- */
  let W = 0, H = 0, DPR = 1, FOC = 1, CX = 0, CY = 0, SCALE = 1;
  let P = [0, 0, 0], F = [0, 0, -1], R = [1, 0, 0], U = [0, 1, 0];
  const NEAR = 30;
  function setCam(p, t) { P = p; F = norm(sub(t, p)); R = norm(cross(F, [0, 1, 0])); U = cross(R, F); }
  function proj(q) { const d = sub(q, P), z = dot(d, F); if (z < NEAR) return null; return [CX + dot(d, R) / z * FOC, CY - dot(d, U) / z * FOC, z]; }
  function seg(a, b) {
    const za = dot(sub(a, P), F), zb = dot(sub(b, P), F);
    if (za < NEAR && zb < NEAR) return null;
    const C = NEAR + 1;
    if (za < C) a = lerp3(a, b, (C - za) / (zb - za));
    else if (zb < C) b = lerp3(b, a, (C - zb) / (za - zb));
    const pa = proj(a), pb = proj(b);
    return pa && pb ? [pa, pb] : null;
  }
  const fog = (z, far) => clamp(1 - z / far, 0, 1);
  function quietAt(x, y) {
    const q = SC[idx].quiet; if (!q || (anim && !anim.revealed)) return false;
    const sx = (x - CX) / SCALE + 960, sy = (y - CY) / SCALE + 540;
    return q.some(r => sx > r[0] && sx < r[2] && sy > r[1] && sy < r[3]);
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, Math.min(innerWidth, innerHeight) < 600 ? 1.5 : 2);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    const sc = Math.min(W / 1920, H / 1080);
    FOC = 1188 * sc; CX = W / 2; CY = H / 2; SCALE = sc;
    stage.style.transform = `translate(-50%, -50%) scale(${sc})`;
    makeGrain();
  }

  let grain = null;
  function makeGrain() {
    const g = document.createElement('canvas'); g.width = g.height = 192;
    const gx = g.getContext('2d'), im = gx.createImageData(192, 192);
    for (let i = 0; i < im.data.length; i += 4) { const v = Math.random() * 255 | 0; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
    gx.putImageData(im, 0, 0); grain = ctx.createPattern(g, 'repeat');
  }
  const DUST = Array.from({ length: 560 }, () => ({ x: Math.random() * 17000 - 3500, y: Math.random() * 1700, z: Math.random() * 6000 - 3800, p: Math.random() * 6.28, s: .5 + Math.random() }));

  /* ---------- state ---------- */
  let idx = 0, beat = 0, anim = null;
  let camNow = SC[0].c.slice(), tgtNow = SC[0].t.slice(), hudYear = SC[0].year;
  const pI = PILLARS.map(() => .2);
  let monA = 0, monText = '', heat = 0, overview = 0, moonA = 1, moonS = 1, mapPulseT = -1;
  const scEls = SC.map(s => $('sc-' + s.id));

  function rgba(c, a) { return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }

  /* ---------- notes ---------- */

  const start = SC.findIndex(s => '#' + s.id === location.hash);
  if (start > 0) go(start, 0, true);
  addEventListener('hashchange', () => { const j = SC.findIndex(s => '#' + s.id === location.hash); if (j >= 0 && j !== idx) go(j); });
  window.__deck = { go, next, prev, count: SC.length, bottom: () => Math.round(contentBottom(scEls[idx])), hudOff: () => $('hudlow').classList.contains('off'), state: () => ({ idx, beat, anim: !!anim }) };
  requestAnimationFrame(frame);
})();
</script>
